<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: '#1e1e1e',
                        darker: '#121212',
                        btnGray: '#303134',
                        btnLightGray: '#5f6368',
                        btnOrange: '#f29900',
                        lightBg: '#f8f9fa',
                        lightBtn: '#e8eaed',
                        lightBtnGray: '#dadce0',
                        sciGray: '#202124',
                        sciLight: '#f1f3f4',
                    }
                }
            }
        }
    </script>
    <style>
        * { user-select: none; -webkit-tap-highlight-color: transparent; }
        .history-scroll::-webkit-scrollbar { width: 4px; }
        .history-scroll::-webkit-scrollbar-thumb { background: #5f6368; border-radius: 4px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-lightBg dark:bg-darker text-black dark:text-white h-[100dvh] w-screen overflow-hidden flex justify-center items-center font-sans transition-colors duration-200">

    <div class="relative w-full max-w-sm h-[100dvh] flex flex-col bg-white dark:bg-dark sm:h-[90vh] sm:rounded-3xl sm:border sm:border-gray-300 dark:sm:border-gray-700 shadow-2xl overflow-hidden">
        
        <!-- Header -->
        <div class="flex justify-between items-center p-4 flex-none">
            <div class="text-lg tracking-wide text-gray-700 dark:text-gray-300 font-medium">Calculator</div>
            <div class="flex gap-4 items-center relative">
                <!-- Scientific Toggle Button -->
                <button id="sciToggleBtn" class="text-gray-600 dark:text-gray-300 p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                </button>

                <!-- Theme Toggle Button -->
                <button id="themeBtn" class="text-gray-600 dark:text-gray-300 p-1">
                    <svg id="themeIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
                
                <!-- 3 Dot Menu -->
                <button id="menuBtn" class="text-gray-600 dark:text-gray-300 p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg>
                </button>

                <!-- Dropdown Menu -->
                <div id="dropdownMenu" class="hidden absolute top-10 right-0 bg-white dark:bg-btnGray rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 w-36 z-50 overflow-hidden">
                    <button id="historyMenuBtn" class="w-full text-left px-4 py-3 text-sm hover:bg-gray-100 dark:hover:bg-btnLightGray transition-colors">History</button>
                </div>
            </div>
        </div>

        <!-- Display Area -->
        <div class="flex-1 flex flex-col justify-end items-end p-4 pb-2 min-h-[120px]">
            <div id="previousInput" class="text-gray-500 dark:text-gray-400 text-2xl mb-1 min-h-[32px] overflow-hidden whitespace-nowrap w-full text-right no-scrollbar"></div>
            <div id="currentInput" class="text-6xl font-light tracking-tight min-h-[72px] overflow-x-auto w-full text-right no-scrollbar flex justify-end items-center transition-all duration-100">0</div>
        </div>

        <!-- Keypads Container -->
        <div class="flex-none flex flex-col overflow-y-auto no-scrollbar pb-6 sm:pb-4">
            
            <!-- Scientific Keypad -->
            <div id="scientificKeypad" class="hidden grid-cols-4 gap-2 px-3 pt-2 pb-1 bg-sciLight dark:bg-sciGray rounded-t-3xl sm:rounded-none">
                <button class="bg-lightBtn dark:bg-btnGray rounded-full text-sm font-medium py-3" onclick="appendValue('sin(')">sin</button>
                <button class="bg-lightBtn dark:bg-btnGray rounded-full text-sm font-medium py-3" onclick="appendValue('cos(')">cos</button>
                <button class="bg-lightBtn dark:bg-btnGray rounded-full text-sm font-medium py-3" onclick="appendValue('tan(')">tan</button>
                <button id="degRadBtn" class="bg-lightBtn dark:bg-btnGray rounded-full text-sm font-bold py-3 text-btnLightGray dark:text-gray-400" onclick="toggleDegRad()">DEG</button>
                
                <button class="bg-lightBtn dark:bg-btnGray rounded-full text-sm font-medium py-3" onclick="appendValue('log(')">log</button>
                <button class="bg-lightBtn dark:bg-btnGray rounded-full text-sm font-medium py-3" onclick="appendValue('ln(')">ln</button>
                <button class="bg-lightBtn dark:bg-btnGray rounded-full text-sm font-medium py-3" onclick="appendValue('(')">(</button>
                <button class="bg-lightBtn dark:bg-btnGray rounded-full text-sm font-medium py-3" onclick="appendValue(')')">)</button>
                
                <button class="bg-lightBtn dark:bg-btnGray rounded-full text-lg font-medium py-2" onclick="appendValue('√(')">√</button>
                <button class="bg-lightBtn dark:bg-btnGray rounded-full text-lg font-medium py-2" onclick="appendValue('^')">^</button>
                <button class="bg-lightBtn dark:bg-btnGray rounded-full text-lg font-medium py-2" onclick="appendValue('π')">π</button>
                <button class="bg-lightBtn dark:bg-btnGray rounded-full text-lg font-medium py-2" onclick="appendValue('!')">!</button>
            </div>

            <!-- Standard Keypad -->
            <div class="grid grid-cols-4 gap-2 p-3 bg-white dark:bg-dark">
                <button class="bg-lightBtnGray dark:bg-btnLightGray text-black dark:text-white rounded-full text-xl flex items-center justify-center py-4" onclick="clearDisplay()">AC</button>
                <button class="bg-lightBtnGray dark:bg-btnLightGray text-black dark:text-white rounded-full text-xl flex items-center justify-center py-4" onclick="appendValue('%')">%</button>
                <button class="bg-lightBtnGray dark:bg-btnLightGray text-black dark:text-white rounded-full text-xl flex items-center justify-center py-4" onclick="deleteLast()">⌫</button>
                <button class="bg-lightBtnGray dark:bg-btnLightGray text-black dark:text-white rounded-full text-3xl pb-1 flex items-center justify-center py-4" onclick="appendValue('÷')">÷</button>

                <button class="bg-lightBtn dark:bg-btnGray rounded-full text-2xl flex items-center justify-center py-4" onclick="appendValue('7')">7</button>
                <button class="bg-lightBtn dark:bg-btnGray rounded-full text-2xl flex items-center justify-center py-4" onclick="appendValue('8')">8</button>
                <button class="bg-lightBtn dark:bg-btnGray rounded-full text-2xl flex items-center justify-center py-4" onclick="appendValue('9')">9</button>
                <button class="bg-lightBtnGray dark:bg-btnLightGray text-black dark:text-white rounded-full text-3xl pb-1 flex items-center justify-center py-4" onclick="appendValue('×')">×</button>

                <button class="bg-lightBtn dark:bg-btnGray rounded-full text-2xl flex items-center justify-center py-4" onclick="appendValue('4')">4</button>
                <button class="bg-lightBtn dark:bg-btnGray rounded-full text-2xl flex items-center justify-center py-4" onclick="appendValue('5')">5</button>
                <button class="bg-lightBtn dark:bg-btnGray rounded-full text-2xl flex items-center justify-center py-4" onclick="appendValue('6')">6</button>
                <button class="bg-lightBtnGray dark:bg-btnLightGray text-black dark:text-white rounded-full text-4xl pb-1 flex items-center justify-center py-4" onclick="appendValue('-')">-</button>

                <button class="bg-lightBtn dark:bg-btnGray rounded-full text-2xl flex items-center justify-center py-4" onclick="appendValue('1')">1</button>
                <button class="bg-lightBtn dark:bg-btnGray rounded-full text-2xl flex items-center justify-center py-4" onclick="appendValue('2')">2</button>
                <button class="bg-lightBtn dark:bg-btnGray rounded-full text-2xl flex items-center justify-center py-4" onclick="appendValue('3')">3</button>
                <button class="bg-lightBtnGray dark:bg-btnLightGray text-black dark:text-white rounded-full text-3xl pb-1 flex items-center justify-center py-4" onclick="appendValue('+')">+</button>

                <button class="bg-lightBtn dark:bg-btnGray rounded-full text-2xl flex items-center justify-center py-4" onclick="appendValue('e')">e</button>
                <button class="bg-lightBtn dark:bg-btnGray rounded-full text-2xl flex items-center justify-center py-4" onclick="appendValue('0')">0</button>
                <button class="bg-lightBtn dark:bg-btnGray rounded-full text-2xl font-bold pb-2 flex items-center justify-center py-4" onclick="appendValue('.')">.</button>
                <button class="bg-btnOrange text-white rounded-full text-3xl pb-1 flex items-center justify-center py-4" onclick="calculateResult()">=</button>
            </div>
        </div>

        <!-- History Overlay -->
        <div id="historyOverlay" class="hidden absolute inset-0 bg-white dark:bg-dark z-40 flex-col">
            <div class="flex items-center justify-between p-4 border-b border-gray-200 dark:border-gray-700">
                <div class="flex items-center gap-4">
                    <button onclick="toggleHistory()" class="p-1">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    </button>
                    <span class="text-xl font-medium">History</span>
                </div>
                <button onclick="clearHistory()" class="p-1">
                    <svg class="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
            </div>
            <div id="historyList" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4 history-scroll"></div>
        </div>

    </div>

    <script>
        let expression = '';
        let isResultDisplayed = false;
        let history = [];
        window.isDeg = true; 

        const currentDisplay = document.getElementById('currentInput');
        const previousDisplay = document.getElementById('previousInput');
        const sciKeypad = document.getElementById('scientificKeypad');
        const sciToggleBtn = document.getElementById('sciToggleBtn');
        const degRadBtn = document.getElementById('degRadBtn');

        document.getElementById('menuBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('dropdownMenu').classList.toggle('hidden');
        });
        document.addEventListener('click', () => document.getElementById('dropdownMenu').classList.add('hidden'));

        document.getElementById('themeBtn').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const icon = document.getElementById('themeIcon');
            if(document.documentElement.classList.contains('dark')) {
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>';
            } else {
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>';
            }
        });

        sciToggleBtn.addEventListener('click', () => {
            if(sciKeypad.classList.contains('hidden')) {
                sciKeypad.classList.remove('hidden');
                sciKeypad.classList.add('grid');
                sciToggleBtn.classList.add('text-btnOrange');
            } else {
                sciKeypad.classList.add('hidden');
                sciKeypad.classList.remove('grid');
                sciToggleBtn.classList.remove('text-btnOrange');
            }
        });

        function toggleDegRad() {
            window.isDeg = !window.isDeg;
            degRadBtn.innerText = window.isDeg ? 'DEG' : 'RAD';
            degRadBtn.classList.toggle('text-btnOrange');
            updateDisplay(); 
        }

        document.getElementById('historyMenuBtn').addEventListener('click', toggleHistory);
        function toggleHistory() {
            const overlay = document.getElementById('historyOverlay');
            overlay.classList.toggle('hidden');
            overlay.classList.toggle('flex');
            updateHistoryUI();
        }

        window.fact = function(n) {
            n = Math.round(n);
            if(n < 0) return NaN;
            if(n <= 1) return 1;
            let r = 1;
            for(let i=2; i<=n; i++) r*=i;
            return r;
        };
        window.sin = function(x) { return Math.sin(window.isDeg ? x * Math.PI/180 : x); };
        window.cos = function(x) { return Math.cos(window.isDeg ? x * Math.PI/180 : x); };
        window.tan = function(x) { return Math.tan(window.isDeg ? x * Math.PI/180 : x); };
        window.log = function(x) { return Math.log10(x); };
        window.ln = function(x) { return Math.log(x); };

        function formatForEval(expr) {
            let s = expr.replace(/×/g, '*').replace(/÷/g, '/').
