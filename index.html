<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: '#1e1e1e',
                        darker: '#121212',
                        btnGray: '#303134',
                        btnLightGray: '#5f6368',
                        btnOrange: '#f29900',
                        lightBg: '#f8f9fa',
                        lightBtn: '#e8eaed',
                        lightBtnGray: '#dadce0',
                    }
                }
            }
        }
    </script>
    <style>
        /* Mobile ma select na thay tena mate */
        * { user-select: none; -webkit-tap-highlight-color: transparent; }
        
        .history-scroll::-webkit-scrollbar { width: 4px; }
        .history-scroll::-webkit-scrollbar-thumb { background: #5f6368; border-radius: 4px; }
    </style>
</head>
<body class="bg-lightBg dark:bg-darker text-black dark:text-white h-[100dvh] w-screen overflow-hidden flex justify-center items-center font-sans transition-colors duration-200">

    <!-- Main Calculator Container -->
    <div class="relative w-full max-w-sm h-[100dvh] flex flex-col bg-white dark:bg-dark sm:h-[90vh] sm:rounded-3xl sm:border sm:border-gray-300 dark:sm:border-gray-700 shadow-2xl overflow-hidden">
        
        <!-- Header -->
        <div class="flex justify-between items-center p-4">
            <div class="text-lg tracking-wide text-gray-700 dark:text-gray-300">Web Calculator</div>
            <div class="flex gap-4 items-center relative">
                <!-- Theme Toggle Button -->
                <button id="themeBtn" class="text-gray-600 dark:text-gray-300 text-xl font-bold p-1">
                    <svg id="themeIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
                
                <!-- 3 Dot Menu -->
                <button id="menuBtn" class="text-gray-600 dark:text-gray-300 font-bold p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg>
                </button>

                <!-- Dropdown Menu -->
                <div id="dropdownMenu" class="hidden absolute top-10 right-0 bg-white dark:bg-btnGray rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 w-36 z-50 overflow-hidden">
                    <button id="historyMenuBtn" class="w-full text-left px-4 py-3 text-sm hover:bg-gray-100 dark:hover:bg-btnLightGray transition-colors">History</button>
                </div>
            </div>
        </div>

        <!-- Display Area -->
        <div class="flex-1 flex flex-col justify-end items-end p-4 pb-2">
            <div id="previousInput" class="text-gray-500 dark:text-gray-400 text-2xl mb-1 min-h-[32px] break-all text-right"></div>
            <div id="currentInput" class="text-6xl font-light tracking-tight min-h-[72px] break-all text-right overflow-x-auto w-full">0</div>
        </div>

        <!-- Keypad Area (Adjusted for mobile fit) -->
        <div class="grid grid-cols-4 gap-2 p-3 pb-6 sm:pb-3 flex-[2]">
            <button class="btn-action bg-lightBtnGray dark:bg-btnLightGray text-black dark:text-white rounded-full text-xl flex items-center justify-center" onclick="clearDisplay()">AC</button>
            <button class="btn-action bg-lightBtnGray dark:bg-btnLightGray text-black dark:text-white rounded-full text-xl flex items-center justify-center" onclick="appendOperator('%')">%</button>
            <button class="btn-action bg-lightBtnGray dark:bg-btnLightGray text-black dark:text-white rounded-full text-xl flex items-center justify-center" onclick="deleteLast()">⌫</button>
            <button class="btn-action bg-lightBtnGray dark:bg-btnLightGray text-black dark:text-white rounded-full text-3xl pb-1 flex items-center justify-center" onclick="appendOperator('/')">÷</button>

            <button class="btn-num bg-lightBtn dark:bg-btnGray rounded-full text-2xl flex items-center justify-center" onclick="appendNumber('7')">7</button>
            <button class="btn-num bg-lightBtn dark:bg-btnGray rounded-full text-2xl flex items-center justify-center" onclick="appendNumber('8')">8</button>
            <button class="btn-num bg-lightBtn dark:bg-btnGray rounded-full text-2xl flex items-center justify-center" onclick="appendNumber('9')">9</button>
            <button class="btn-action bg-lightBtnGray dark:bg-btnLightGray text-black dark:text-white rounded-full text-3xl pb-1 flex items-center justify-center" onclick="appendOperator('*')">×</button>

            <button class="btn-num bg-lightBtn dark:bg-btnGray rounded-full text-2xl flex items-center justify-center" onclick="appendNumber('4')">4</button>
            <button class="btn-num bg-lightBtn dark:bg-btnGray rounded-full text-2xl flex items-center justify-center" onclick="appendNumber('5')">5</button>
            <button class="btn-num bg-lightBtn dark:bg-btnGray rounded-full text-2xl flex items-center justify-center" onclick="appendNumber('6')">6</button>
            <button class="btn-action bg-lightBtnGray dark:bg-btnLightGray text-black dark:text-white rounded-full text-4xl pb-1 flex items-center justify-center" onclick="appendOperator('-')">-</button>

            <button class="btn-num bg-lightBtn dark:bg-btnGray rounded-full text-2xl flex items-center justify-center" onclick="appendNumber('1')">1</button>
            <button class="btn-num bg-lightBtn dark:bg-btnGray rounded-full text-2xl flex items-center justify-center" onclick="appendNumber('2')">2</button>
            <button class="btn-num bg-lightBtn dark:bg-btnGray rounded-full text-2xl flex items-center justify-center" onclick="appendNumber('3')">3</button>
            <button class="btn-action bg-lightBtnGray dark:bg-btnLightGray text-black dark:text-white rounded-full text-3xl pb-1 flex items-center justify-center" onclick="appendOperator('+')">+</button>

            <button class="btn-num bg-lightBtn dark:bg-btnGray rounded-full text-2xl flex items-center justify-center" onclick="appendNumber('00')">00</button>
            <button class="btn-num bg-lightBtn dark:bg-btnGray rounded-full text-2xl flex items-center justify-center" onclick="appendNumber('0')">0</button>
            <button class="btn-num bg-lightBtn dark:bg-btnGray rounded-full text-2xl font-bold pb-2 flex items-center justify-center" onclick="appendNumber('.')">.</button>
            <button class="bg-btnOrange text-white rounded-full text-3xl pb-1 flex items-center justify-center" onclick="calculate()">=</button>
        </div>

        <!-- History Overlay -->
        <div id="historyOverlay" class="hidden absolute inset-0 bg-white dark:bg-dark z-40 flex-col">
            <div class="flex items-center justify-between p-4 border-b border-gray-200 dark:border-gray-700">
                <div class="flex items-center gap-4">
                    <button onclick="toggleHistory()" class="p-1">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    </button>
                    <span class="text-xl font-medium">History</span>
                </div>
                <button onclick="clearHistory()" class="p-1">
                    <svg class="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
            </div>
            <div id="historyList" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4 history-scroll">
                <!-- History items will appear here -->
            </div>
        </div>

    </div>

    <script>
        let currentInput = '0';
        let previousInput = '';
        let operator = '';
        let isResultDisplayed = false;
        let history = [];

        const currentDisplay = document.getElementById('currentInput');
        const previousDisplay = document.getElementById('previousInput');
        
        // Menu Toggle
        document.getElementById('menuBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('dropdownMenu').classList.toggle('hidden');
        });

        document.addEventListener('click', () => {
            document.getElementById('dropdownMenu').classList.add('hidden');
        });

        // Theme Toggle (Light/Dark)
        document.getElementById('themeBtn').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const icon = document.getElementById('themeIcon');
            if(document.documentElement.classList.contains('dark')) {
                // Moon icon
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>';
            } else {
                // Sun icon
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>';
            }
        });

        // History Toggle
        document.getElementById('historyMenuBtn').addEventListener('click', () => {
            toggleHistory();
        });

        function toggleHistory() {
            document.getElementById('historyOverlay').classList.toggle('hidden');
            document.getElementById('historyOverlay').classList.toggle('flex');
            updateHistoryUI();
        }

        function updateDisplay() {
            // Add comma formatting for large numbers
            currentDisplay.innerText = currentInput.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            previousDisplay.innerText = previousInput + ' ' + operator;
        }

        function appendNumber(num) {
            if (isResultDisplayed) {
                currentInput = num;
                isResultDisplayed = false;
            } else {
                if (currentInput === '0' && num !== '.') {
                    currentInput = num;
                } else if (num === '.' && currentInput.includes('.')) {
                    return; // Prevent multiple dots
                } else {
                    currentInput += num;
                }
            }
            // Fix overflow size
            if (currentInput.length > 10) {
                currentDisplay.style.fontSize = '3rem';
            } else {
                currentDisplay.style.fontSize = '3.75rem';
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (currentInput === '') return;
            if (previousInput !== '' && !isResultDisplayed) {
                calculate();
            }
            operator = op;
            previousInput = currentInput;
            currentInput = '';
            isResultDisplayed = false;
            updateDisplay();
        }

        function calculate() {
            if (currentInput === '' || previousInput === '') return;
            let result;
            const prev = parseFloat(previousInput.replace(/,/g, ''));
            const current = parseFloat(currentInput.replace(/,/g, ''));
            
            if (isNaN(prev) || isNaN(current)) return;

            let equation = `${prev} ${operator.replace('*', '×').replace('/', '÷')} ${current}`;

            switch (operator) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case '*': result = prev * current; break;
                case '/': 
                    if (current === 0) {
                        currentInput = "Error";
                        updateDisplay();
                        return;
                    }
                    result = prev / current; 
                    break;
                case '%': result = prev % current; break;
                default: return;
            }

            // Remove trailing decimal zeroes
            result = parseFloat(result.toFixed(8)).toString();

            // Save to history
            history.unshift({ equation: equation, result: result, date: new Date().toLocaleDateString() });

            currentInput = result;
            operator = '';
            previousInput = '';
            isResultDisplayed = true;
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = '0';
            previousInput = '';
            operator = '';
            currentDisplay.style.fontSize = '3.75rem';
            updateDisplay();
        }

        function deleteLast() {
            if (isResultDisplayed) {
                clearDisplay();
                return;
            }
            if (currentInput.length === 1) {
                currentInput = '0';
            } else {
                currentInput = currentInput.slice(0, -1);
            }
            updateDisplay();
        }

        function clearHistory() {
            history = [];
            updateHistoryUI();
        }

        function updateHistoryUI() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            if(history.length === 0) {
                list.innerHTML = '<div class="text-center text-gray-500 mt-10">No history yet</div>';
                return;
            }
            history.forEach(item => {
                const div = document.createElement('div');
                div.className = "bg-gray-50 dark:bg-btnGray rounded-2xl p-4 flex flex-col items-end cursor-pointer";
                div.innerHTML = `
                    <div class="text-gray-500 text-sm mb-1">${item.equation}</div>
                    <div class="text-2xl font-medium text-black dark:text-white">${item.result}</div>
                    <div class="text-xs text-gray-400 mt-2 self-start">${item.date}</div>
                `;
                // Allow clicking history to load result
                div.onclick = () => {
                    currentInput = item.result;
                    isResultDisplayed = true;
                    toggleHistory();
                    updateDisplay();
                };
                list.appendChild(div);
            });
        }
    </script>
</body>
</html>
